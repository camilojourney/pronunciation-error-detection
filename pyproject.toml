[project]
name = "ped"
version = "0.1.0"
description = "Pronunciation Error Detection core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-Levenshtein>=0.20",
  "jiwer>=3.0",
  "openai>=2.9.0",
  "pydub>=0.25.1",
  "python-dotenv>=1.2.1",
  "nltk>=3.8.1",
  "textgrid>=1.5",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[project.optional-dependencies]
ml = [
  "faster-whisper>=0.10",
  "torch>=2.0",
  "torchaudio>=2.0",
  "spacy>=3.7",
  "phonemizer>=3.2",
  "g2p-en>=2.1",
]

dev = [
  "pytest>=7.0",
  "ruff>=0.5.0",
  "mypy>=1.8.0",
  "pre-commit>=3.5",
]

experiments = [
  "jupyter>=1.0",
  "ipykernel>=6.25",
  "quarto>=0.1",
  "scikit-learn>=1.3",
  "numpy>=1.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ped"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["analysis_utils.py", "process_l2arctic.py"]
